<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>线路实时车辆</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f4f1;
      --card: #fff;
      --text: #1d1d1f;
      --muted: #777;
      --line: #e5e5df;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    }

    .page {
      max-width: 1100px;
      margin: auto;
      padding:
        calc(16px + env(safe-area-inset-top))
        14px
        calc(35px + env(safe-area-inset-bottom));
    }

    .top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .back,
    .refresh {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      color: #111;
      text-decoration: none;
      display: grid;
      place-items: center;
      font-size: 20px;
      cursor: pointer;
    }

    .head {
      min-width: 0;
      flex: 1;
    }

    .head strong {
      display: block;
      font-size: 19px;
    }

    .head small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search input {
      flex: 1;
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      font-size: 16px;
    }

    .search button {
      border: 0;
      border-radius: 13px;
      background: #1d1d1f;
      color: #fff;
      padding: 0 17px;
      cursor: pointer;
    }

    .map-wrap {
      position: relative;
    }

    #map {
      height: 58vh;
      min-height: 410px;
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      background: #e9e9e5;
    }

    .map-legend {
      position: absolute;
      z-index: 500;
      left: 12px;
      bottom: 12px;
      max-width: min(82%, 370px);
      padding: 9px 11px;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 13px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      font-size: 11px;
      line-height: 1.5;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .legend-row + .legend-row {
      margin-top: 4px;
    }

    .line-swatch {
      width: 22px;
      height: 4px;
      border-radius: 999px;
      background: #585858;
    }

    .line-swatch.direction-0 {
      background: #2f6fed;
    }

    .line-swatch.direction-1 {
      background: #e05d44;
    }

    .summary {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );
      gap: 10px;
      margin-top: 12px;
    }

    .direction {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      min-width: 0;
    }

    .direction-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 7px;
    }

    .direction h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.35;
    }

    .direction-code {
      flex: 0 0 auto;
      padding: 4px 7px;
      border-radius: 999px;
      background: #efefec;
      color: #777;
      font-size: 9px;
    }

    .vehicle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-top: 1px solid #eee;
      font-size: 12px;
    }

    .vehicle-row:first-of-type {
      border-top: 0;
    }

    .vehicle-meta {
      min-width: 0;
    }

    .vehicle-meta strong {
      display: block;
      font-size: 12px;
    }

    .vehicle-meta small {
      display: block;
      color: #999;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .muted {
      color: #888;
    }

    .status {
      margin-top: 11px;
      color: #777;
      font-size: 12px;
      line-height: 1.55;
    }

    .bus-pin {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #222;
      display: grid;
      place-items: center;
      font-size: 21px;
      box-shadow: 0 3px 10px #0003;
    }

    .bus-pin-label {
      position: absolute;
      top: 29px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 150px;
      white-space: nowrap;
      padding: 2px 6px;
      border-radius: 7px;
      background: #222;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
    }

    @media (max-width: 620px) {
      .summary {
        grid-template-columns: 1fr;
      }

      #map {
        height: 53vh;
        min-height: 360px;
      }

      .map-legend {
        max-width: calc(100% - 24px);
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <div class="top">

      <a
        class="back"
        href="./"
        aria-label="返回主页"
      >
        ‹
      </a>

      <div class="head">

        <strong id="title">
          线路实时车辆
        </strong>

        <small id="sub">
          正在读取…
        </small>

      </div>

      <button
        id="refresh"
        class="refresh"
        type="button"
        aria-label="刷新"
      >
        ↻
      </button>

    </div>


    <form
      id="search"
      class="search"
    >

      <input
        id="routeInput"
        inputmode="numeric"
        autocomplete="off"
        placeholder="线路号，例如 27"
        aria-label="线路号"
      >

      <button type="submit">
        查询
      </button>

    </form>


    <div class="map-wrap">

      <div id="map"></div>

      <div
        id="legend"
        class="map-legend"
      >
        <div class="legend-row">
          <span class="line-swatch"></span>
          <span>线路全程</span>
        </div>
      </div>

    </div>


    <div
      id="summary"
      class="summary"
    ></div>


    <div
      id="status"
      class="status"
    ></div>

  </main>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script src="config.js"></script>


  <script>

    // ========================================================
    // State
    // ========================================================

    const params =
      new URLSearchParams(
        location.search
      );

    let currentRoute =
      params.get("route") ||
      "27";

    const routeInput =
      document.getElementById(
        "routeInput"
      );

    routeInput.value =
      currentRoute;


    const map =
      L.map(
        "map",
        {
          zoomControl: true
        }
      )
      .setView(
        [
          42.9849,
          -81.2453
        ],
        12
      );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          "© OpenStreetMap"
      }
    )
    .addTo(map);


    const vehicleLayer =
      L.layerGroup()
        .addTo(map);


    const routeLayer =
      L.layerGroup()
        .addTo(map);


    const directionShapeLayer =
      L.layerGroup()
        .addTo(map);


    let firstLoadForRoute =
      true;



    // ========================================================
    // Helpers
    // ========================================================

    function escapeHtml(
      value = ""
    ) {

      return String(value)
        .replace(
          /[&<>"']/g,
          character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[character])
        );
    }


    function geometryToLatLngs(
      geometry
    ) {

      if (!geometry) {
        return [];
      }


      if (
        geometry.type ===
        "LineString"
      ) {

        return [
          geometry.coordinates
            .map(
              coordinate => [
                Number(coordinate[1]),
                Number(coordinate[0])
              ]
            )
            .filter(
              point =>
                Number.isFinite(point[0]) &&
                Number.isFinite(point[1])
            )
        ];
      }


      if (
        geometry.type ===
        "MultiLineString"
      ) {

        return geometry.coordinates
          .map(
            line =>
              line
                .map(
                  coordinate => [
                    Number(coordinate[1]),
                    Number(coordinate[0])
                  ]
                )
                .filter(
                  point =>
                    Number.isFinite(point[0]) &&
                    Number.isFinite(point[1])
                )
          )
          .filter(
            line =>
              line.length >= 2
          );
      }


      return [];
    }


    function directionColor(
      directionId
    ) {

      if (
        Number(directionId) === 0
      ) {
        return "#2f6fed";
      }


      if (
        Number(directionId) === 1
      ) {
        return "#e05d44";
      }


      return "#777777";
    }


    function directionLabel(
      vehicle
    ) {

      if (
        vehicle.headsign
      ) {
        return vehicle.headsign;
      }


      if (
        vehicle.directionId !== null &&
        vehicle.directionId !== undefined
      ) {
        return `方向 ${vehicle.directionId}`;
      }


      return "方向未知";
    }


    function busIcon(
      route,
      vehicle
    ) {

      const label =
        directionLabel(
          vehicle
        );


      const color =
        directionColor(
          vehicle.directionId
        );


      return L.divIcon(
        {
          className: "",

          html:
            `<div class="bus-pin" style="border-color:${color}">` +
              `🚌` +
              `<span class="bus-pin-label">` +
                `${escapeHtml(route)} · ${escapeHtml(label)}` +
              `</span>` +
            `</div>`,

          iconSize:
            [40, 40],

          iconAnchor:
            [20, 20]
        }
      );
    }


    function addGeometry(
      layer,
      geometry,
      options,
      boundsPoints
    ) {

      const lines =
        geometryToLatLngs(
          geometry
        );


      for (
        const latlngs
        of lines
      ) {

        if (
          latlngs.length < 2
        ) {
          continue;
        }


        L.polyline(
          latlngs,
          options
        )
        .addTo(
          layer
        );


        boundsPoints.push(
          ...latlngs
        );

      }

    }



    // ========================================================
    // Route line
    // ========================================================

    function drawRoute(
      data,
      boundsPoints
    ) {

      routeLayer.clearLayers();
      directionShapeLayer.clearLayers();


      // ------------------------------------------------------
      // 灰色粗线：整条线路的 representative geometry
      // ------------------------------------------------------

      if (
        data.route?.geometry
      ) {

        addGeometry(
          routeLayer,
          data.route.geometry,
          {
            color:
              "#595959",

            weight:
              8,

            opacity:
              0.34,

            lineCap:
              "round",

            lineJoin:
              "round"
          },
          boundsPoints
        );

      }


      // ------------------------------------------------------
      // 当前运行车辆对应的实际 trip shape
      //
      // 方向 0 蓝色
      // 方向 1 红色
      //
      // 这样有单行道/不同返程道路时也能看出来。
      // ------------------------------------------------------

      const shapes =
        Array.isArray(
          data.directionShapes
        )
          ? data.directionShapes
          : [];


      for (
        const item
        of shapes
      ) {

        addGeometry(
          directionShapeLayer,
          item.geometry,
          {
            color:
              directionColor(
                item.directionId
              ),

            weight:
              4,

            opacity:
              0.82,

            lineCap:
              "round",

            lineJoin:
              "round"
          },
          boundsPoints
        );

      }

    }



    // ========================================================
    // Legend
    // ========================================================

    function renderLegend(
      data
    ) {

      const directions =
        Array.isArray(
          data.directions
        )
          ? data.directions
          : [];


      let html = `

        <div class="legend-row">

          <span class="line-swatch"></span>

          <span>
            线路全程
          </span>

        </div>

      `;


      for (
        const direction
        of directions
      ) {

        if (
          direction.directionId === null ||
          direction.directionId === undefined
        ) {
          continue;
        }


        const label =

          direction.headsign ||

          `方向 ${direction.directionId}`;


        html += `

          <div class="legend-row">

            <span
              class="line-swatch direction-${escapeHtml(direction.directionId)}"
            ></span>

            <span>
              ${escapeHtml(label)}
            </span>

          </div>

        `;

      }


      document
        .getElementById(
          "legend"
        )
        .innerHTML =
          html;

    }



    // ========================================================
    // Summary
    // ========================================================

    function renderSummary(
      data
    ) {

      const vehicles =
        Array.isArray(
          data.vehicles
        )
          ? data.vehicles
          : [];


      const directionGroups =
        new Map();


      for (
        const vehicle
        of vehicles
      ) {

        const key =

          vehicle.directionId === null ||
          vehicle.directionId === undefined

            ? "unknown"

            : String(
                vehicle.directionId
              );


        if (
          !directionGroups.has(
            key
          )
        ) {

          directionGroups.set(
            key,
            {
              directionId:
                vehicle.directionId,

              headsign:
                vehicle.headsign || "",

              vehicles:
                []
            }
          );

        }


        const group =
          directionGroups.get(
            key
          );


        if (
          !group.headsign &&
          vehicle.headsign
        ) {

          group.headsign =
            vehicle.headsign;

        }


        group.vehicles.push(
          vehicle
        );

      }


      // 如果某个方向当前 0 辆车，但 Worker 有 direction 摘要，
      // 也显示这个方向。
      const directions =
        Array.isArray(
          data.directions
        )
          ? data.directions
          : [];


      for (
        const direction
        of directions
      ) {

        const key =

          direction.directionId === null ||
          direction.directionId === undefined

            ? "unknown"

            : String(
                direction.directionId
              );


        if (
          !directionGroups.has(
            key
          )
        ) {

          directionGroups.set(
            key,
            {
              directionId:
                direction.directionId,

              headsign:
                direction.headsign || "",

              vehicles:
                []
            }
          );

        }

      }


      const groups =
        [
          ...directionGroups.values()
        ]
        .sort(
          (a, b) => {

            const da =
              a.directionId === null
                ? 99
                : Number(
                    a.directionId
                  );

            const db =
              b.directionId === null
                ? 99
                : Number(
                    b.directionId
                  );

            return da - db;

          }
        );


      document
        .getElementById(
          "summary"
        )
        .innerHTML =

          groups.length

            ? groups
                .map(
                  group => {


                    const name =

                      group.headsign ||

                      (
                        group.directionId === null

                          ? "方向未知"

                          : `方向 ${group.directionId}`
                      );


                    const vehicleRows =

                      group.vehicles.length

                        ? group.vehicles
                            .map(
                              vehicle => `

                                <div class="vehicle-row">

                                  <div class="vehicle-meta">

                                    <strong>
                                      🚌 ${escapeHtml(
                                        vehicle.label ||
                                        vehicle.id ||
                                        "车辆"
                                      )}
                                    </strong>

                                    <small>
                                      ${escapeHtml(
                                        vehicle.headsign ||
                                        name
                                      )}
                                    </small>

                                  </div>

                                  <span class="muted">
                                    ${escapeHtml(
                                      vehicle.updatedText ||
                                      ""
                                    )}
                                  </span>

                                </div>

                              `
                            )
                            .join("")

                        : `

                            <div class="muted">
                              当前没有带实时定位的车辆
                            </div>

                          `;


                    return `

                      <section class="direction">

                        <div class="direction-head">

                          <h3>
                            ${escapeHtml(name)}
                            ·
                            ${group.vehicles.length} 辆
                          </h3>

                          ${
                            group.directionId === null

                              ? ""

                              : `

                                  <span class="direction-code">
                                    GTFS direction_id ${escapeHtml(group.directionId)}
                                  </span>

                                `
                          }

                        </div>

                        ${vehicleRows}

                      </section>

                    `;

                  }
                )
                .join("")

            : `

                <section class="direction">

                  <h3>
                    暂无实时车辆
                  </h3>

                  <div class="muted">
                    线路仍然会显示在地图上。
                  </div>

                </section>

              `;

    }



    // ========================================================
    // Load
    // ========================================================

    async function loadRoute() {

      const route =
        String(
          currentRoute || ""
        )
          .trim()
          .replace(
            /^route\s*/i,
            ""
          );


      if (!route) {
        return;
      }


      const title =
        document.getElementById(
          "title"
        );


      const sub =
        document.getElementById(
          "sub"
        );


      const status =
        document.getElementById(
          "status"
        );


      title.textContent =
        `Route ${route} · 实时车辆`;


      sub.textContent =
        "正在读取线路与实时车辆…";


      vehicleLayer.clearLayers();


      try {

        const api =
          CONFIG
            .TRANSIT_API_URL
            .replace(
              /\/+$/,
              ""
            );


        const response =
          await fetch(
            `${api}/route-vehicles?route=${encodeURIComponent(route)}`,
            {
              cache:
                "no-store"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            `Worker HTTP ${response.status}: ${await response.text()}`
          );

        }


        const data =
          await response.json();


        if (
          data.error
        ) {

          throw new Error(
            data.detail ||
            data.error
          );

        }


        const vehicles =
          Array.isArray(
            data.vehicles
          )
            ? data.vehicles
            : [];


        const displayRoute =

          data.route?.routeShortName ||

          data.route?.routeId ||

          route;


        currentRoute =
          displayRoute;


        routeInput.value =
          displayRoute;


        title.textContent =
          `Route ${displayRoute} · 实时车辆`;


        const routeName =
          data.route?.routeLongName ||
          "";


        sub.textContent =

          `${routeName ? routeName + " · " : ""}` +

          `当前 ${vehicles.length} 辆有实时定位`;


        const boundsPoints =
          [];


        // 线路全程 + 两方向实际 trip shape
        drawRoute(
          data,
          boundsPoints
        );


        // 车辆
        for (
          const vehicle
          of vehicles
        ) {

          const lat =
            Number(
              vehicle.lat
            );


          const lon =
            Number(
              vehicle.lon
            );


          if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lon)
          ) {
            continue;
          }


          const point =
            [lat, lon];


          boundsPoints.push(
            point
          );


          L.marker(
            point,
            {
              icon:
                busIcon(
                  displayRoute,
                  vehicle
                )
            }
          )
          .addTo(
            vehicleLayer
          )
          .bindPopup(

            `<strong>Route ${escapeHtml(displayRoute)}</strong><br>` +

            `${escapeHtml(directionLabel(vehicle))}<br>` +

            `车辆：${escapeHtml(vehicle.label || vehicle.id || "—")}<br>` +

            `GTFS trip：${escapeHtml(vehicle.tripId || "—")}<br>` +

            `更新：${escapeHtml(vehicle.updatedText || "—")}`

          );

        }


        renderLegend(
          data
        );


        renderSummary(
          data
        );


        // 第一次查询某条线路时，自动缩放到线路全程。
        if (
          firstLoadForRoute &&
          boundsPoints.length
        ) {

          map.fitBounds(
            L.latLngBounds(
              boundsPoints
            ),
            {
              padding:
                [35, 35],

              maxZoom:
                14
            }
          );


          firstLoadForRoute =
            false;

        }


        status.textContent =

          `数据更新时间：${new Date(
            data.generatedAt ||
            Date.now()
          ).toLocaleTimeString(
            "zh-CN",
            {
              hour:
                "2-digit",

              minute:
                "2-digit",

              second:
                "2-digit"
            }
          )} · ` +

          `灰色粗线是整条线路；蓝/红细线是当前两个方向车辆的实际 GTFS trip shape。`;

      }


      catch (
        error
      ) {

        console.error(
          error
        );


        sub.textContent =
          "读取失败";


        status.textContent =
          error.message ||
          String(error);


        document
          .getElementById(
            "summary"
          )
          .innerHTML =
            "";

      }

    }



    // ========================================================
    // Search
    // ========================================================

    document
      .getElementById(
        "search"
      )
      .addEventListener(
        "submit",
        event => {

          event.preventDefault();


          const value =
            routeInput
              .value
              .trim()
              .replace(
                /^route\s*/i,
                ""
              );


          if (!value) {
            return;
          }


          currentRoute =
            value;


          history.replaceState(
            null,
            "",
            `route.html?route=${encodeURIComponent(value)}`
          );


          firstLoadForRoute =
            true;


          routeLayer.clearLayers();
          directionShapeLayer.clearLayers();
          vehicleLayer.clearLayers();


          loadRoute();

        }
      );


    document
      .getElementById(
        "refresh"
      )
      .addEventListener(
        "click",
        loadRoute
      );


    loadRoute();


    // Transitland 的 GTFS-RT 缓存约每分钟刷新；
    // 网页 30 秒检查一次即可。
    setInterval(
      loadRoute,
      30000
    );

  </script>

</body>

</html>
