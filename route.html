<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>线路实时车辆</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f1;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.page{max-width:1000px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 35px}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back,.refresh{width:44px;height:44px;border:1px solid #e5e5df;border-radius:13px;background:#fff;color:#111;text-decoration:none;display:grid;place-items:center;font-size:20px}.head{flex:1}.head strong{font-size:19px;display:block}.head small{display:block;color:#777;margin-top:3px}
.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1;min-width:0;padding:12px;border:1px solid #e5e5df;border-radius:13px;background:#fff;font-size:16px}.search button{border:0;border-radius:13px;background:#1d1d1f;color:#fff;padding:0 16px}
#map{height:56vh;min-height:390px;border:1px solid #e5e5df;border-radius:22px;overflow:hidden;background:#e9e9e5}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.direction{background:#fff;border:1px solid #e5e5df;border-radius:18px;padding:14px}.direction h3{margin:0 0 8px;font-size:14px}.vehicle-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #eee;font-size:12px}.vehicle-row:first-of-type{border-top:0}.muted{color:#888}.status{margin-top:11px;color:#777;font-size:12px}
.bus-pin{width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid #222;display:grid;place-items:center;font-size:21px;box-shadow:0 3px 10px #0003}.bus-pin span{font-size:9px;font-weight:700;position:absolute;margin-top:28px;background:#222;color:#fff;padding:2px 5px;border-radius:7px}
@media(max-width:580px){.summary{grid-template-columns:1fr}#map{height:52vh;min-height:350px}}
</style>
</head>
<body>
<main class="page">
  <div class="top">
    <a class="back" href="./">‹</a>
    <div class="head"><strong id="title">线路实时车辆</strong><small id="sub">正在读取…</small></div>
    <button id="refresh" class="refresh" type="button">↻</button>
  </div>

  <form id="search" class="search">
    <input id="routeInput" inputmode="numeric" placeholder="线路号，例如 127">
    <button type="submit">查询</button>
  </form>

  <div id="map"></div>
  <div id="summary" class="summary"></div>
  <div id="status" class="status"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script>
const params=new URLSearchParams(location.search);
let currentRoute=params.get("route")||"27";
const input=document.getElementById("routeInput");
input.value=currentRoute;

const map=L.map("map").setView([42.9849,-81.2453],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
let markerLayer=L.layerGroup().addTo(map);
let firstLoad=true;

function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function directionName(route,id){
  return CONFIG.ROUTE_DIRECTION_NAMES?.[String(route)]?.[String(id)] || `方向 ${id ?? "?"}`;
}
function markerIcon(route,direction){
  return L.divIcon({
    className:"",
    html:`<div class="bus-pin">🚌<span>${esc(route)} · ${esc(direction)}</span></div>`,
    iconSize:[38,38],iconAnchor:[19,19]
  });
}

async function load(){
  const r=String(currentRoute||"").trim().replace(/^route\s*/i,"");
  if(!r)return;
  document.getElementById("title").textContent=`Route ${r} · 实时车辆`;
  document.getElementById("sub").textContent="正在读取车辆位置…";
  markerLayer.clearLayers();

  try{
    const api=CONFIG.TRANSIT_API_URL.replace(/\/+$/,"");
    const res=await fetch(`${api}/route-vehicles?route=${encodeURIComponent(r)}`,{cache:"no-store"});
    if(!res.ok)throw new Error(`Worker HTTP ${res.status}: ${await res.text()}`);
    const data=await res.json();
    if(data.error)throw new Error(data.detail||data.error);

    const vehicles=Array.isArray(data.vehicles)?data.vehicles:[];
    const bounds=[];
    const groups=new Map();

    vehicles.forEach(v=>{
      const did=v.directionId==null?"?":String(v.directionId);
      if(!groups.has(did))groups.set(did,[]);
      groups.get(did).push(v);

      if(Number.isFinite(Number(v.lat))&&Number.isFinite(Number(v.lon))){
        const p=[Number(v.lat),Number(v.lon)];
        bounds.push(p);
        L.marker(p,{icon:markerIcon(r,directionName(r,did))})
          .addTo(markerLayer)
          .bindPopup(`<strong>Route ${esc(r)}</strong><br>${esc(directionName(r,did))}<br>车辆 ${esc(v.label||v.id||"—")}<br>更新 ${esc(v.updatedText||"—")}`);
      }
    });

    if(firstLoad&&bounds.length){
      map.fitBounds(L.latLngBounds(bounds),{padding:[45,45],maxZoom:14});
      firstLoad=false;
    }

    const ids=[...new Set([...Object.keys(CONFIG.ROUTE_DIRECTION_NAMES?.[r]||{}),...groups.keys()])];
    document.getElementById("summary").innerHTML=ids.map(id=>{
      const vs=groups.get(String(id))||[];
      return `<section class="direction">
        <h3>${esc(directionName(r,id))} · ${vs.length} 辆</h3>
        ${vs.length?vs.map(v=>`<div class="vehicle-row"><span>🚌 ${esc(v.label||v.id||"车辆")}</span><span class="muted">${esc(v.updatedText||"")}</span></div>`).join(""):`<div class="muted">当前没有带实时定位的车辆</div>`}
      </section>`;
    }).join("");

    document.getElementById("sub").textContent=`当前找到 ${vehicles.length} 辆带实时定位的公交`;
    document.getElementById("status").textContent=`数据更新时间：${new Date(data.generatedAt||Date.now()).toLocaleTimeString("zh-CN")}`;
  }catch(e){
    document.getElementById("sub").textContent="读取失败";
    document.getElementById("status").textContent=e.message||String(e);
    document.getElementById("summary").innerHTML="";
  }
}

document.getElementById("search").addEventListener("submit",e=>{
  e.preventDefault();
  const v=input.value.trim().replace(/^route\s*/i,"");
  if(!v)return;
  currentRoute=v;
  history.replaceState(null,"",`route.html?route=${encodeURIComponent(v)}`);
  firstLoad=true;
  load();
});
document.getElementById("refresh").addEventListener("click",load);
load();
setInterval(load,30000);
</script>
</body>
</html>
