<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>访问记录 · Personal Dashboard</title>
  <style>
    :root{--bg:#f4f4f1;--card:#fff;--text:#1d1d1f;--muted:#8a8a8e;--line:#e5e5e0;--dark:#1d1d1f;--bad:#a34c43}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif}
    main{width:min(1180px,calc(100% - 28px));margin:28px auto 70px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted)}h1{margin:7px 0 5px;font-size:34px}p{margin:0;color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.035);margin-bottom:16px}.login{display:grid;grid-template-columns:1fr auto;gap:10px}input,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px 14px}input{background:#fafaf8;min-width:0}button{background:var(--dark);color:#fff;border-color:var(--dark);cursor:pointer}.secondary{background:#efefec;color:#333;border-color:#efefec}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.toolbar input{width:220px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px;border-radius:16px;background:#f7f7f4}.stat strong{display:block;font-size:26px}.stat span{font-size:11px;color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:1000px;background:#fff}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #eee;font-size:12px;vertical-align:top}th{position:sticky;top:0;background:#f8f8f6;color:#777;font-size:10px;letter-spacing:.04em}tr:last-child td{border-bottom:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.muted{color:var(--muted)}.ua{max-width:300px;white-space:normal;word-break:break-word}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.error{color:var(--bad);font-size:12px;margin-top:10px}.hidden{display:none!important}@media(max-width:650px){main{width:min(100% - 20px,1180px);margin-top:18px}.head{display:block}h1{font-size:29px}.login{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.toolbar input{width:100%}.card{padding:15px;border-radius:20px}}
  </style>
</head>
<body>
<main>
  <div class="head">
    <div><div class="eyebrow">PRIVATE · VISIT LOG</div><h1>访问记录</h1><p>管理员密钥只保存在当前标签页的 sessionStorage，不写入 GitHub。</p></div>
    <a href="./" style="color:#333;text-decoration:none;font-size:13px">← 返回主页</a>
  </div>

  <section id="loginCard" class="card">
    <div class="login">
      <input id="adminKey" type="password" autocomplete="current-password" placeholder="输入 Cloudflare ADMIN_KEY">
      <button id="loginBtn" type="button">查看记录</button>
    </div>
    <div id="loginStatus" style="margin-top:10px;color:#8a8a8e;font-size:12px"></div>
    <div id="loginError" class="error"></div>
  </section>

  <div id="dashboard" class="hidden">
    <section class="card">
      <div class="stats">
        <div class="stat"><strong id="statTotal">—</strong><span>记录总数</span></div>
        <div class="stat"><strong id="statUnique">—</strong><span>不同 IP</span></div>
        <div class="stat"><strong id="stat24">—</strong><span>过去 24 小时访问</span></div>
      </div>
    </section>

    <section class="card">
      <div class="toolbar">
        <input id="ipFilter" type="search" placeholder="按 IP 搜索">
        <button id="searchBtn" type="button">搜索</button>
        <button id="refreshBtn" class="secondary" type="button">刷新</button>
        <button id="logoutBtn" class="secondary" type="button">退出</button>
      </div>
      <div id="dataError" class="error"></div>
    </section>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>时间</th><th>IP</th><th>地区</th><th>页面</th><th>网络</th><th>设备 / 浏览器</th><th>来源</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="pager">
        <button id="prevBtn" class="secondary" type="button">上一页</button>
        <span id="pageInfo" class="muted">—</span>
        <button id="nextBtn" class="secondary" type="button">下一页</button>
      </div>
    </section>
  </div>
</main>
<script src="config.js?v=10"></script>
<script>
const FALLBACK_API =
  "https://ltc-home-bus2.jiangfan0611.workers.dev";

const api =
  String(
    (typeof CONFIG !== "undefined" &&
      CONFIG.TRANSIT_API_URL) ||
    FALLBACK_API
  ).replace(/\/+$/, "");

const limit = 100;
let offset = 0;

const $ =
  id =>
    document.getElementById(id);

const esc =
  value =>
    String(value ?? "")
      .replace(
        /[&<>"']/g,
        char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]
      );

function localTime(iso) {
  try {
    return new Date(iso)
      .toLocaleString(
        "zh-CN",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }
      );
  }
  catch {
    return iso;
  }
}

function device(ua) {
  ua =
    String(ua || "");

  const os =
    /iPhone/i.test(ua)
      ? "iPhone"
      : /iPad/i.test(ua)
      ? "iPad"
      : /Android/i.test(ua)
      ? "Android"
      : /Windows/i.test(ua)
      ? "Windows"
      : /Macintosh/i.test(ua)
      ? "Mac"
      : "其他";

  const browser =
    /Edg\//.test(ua)
      ? "Edge"
      : /CriOS|Chrome\//.test(ua)
      ? "Chrome"
      : /Safari\//.test(ua)
      ? "Safari"
      : /Firefox\//.test(ua)
      ? "Firefox"
      : "浏览器";

  return `${os} · ${browser}`;
}

function key() {
  return (
    sessionStorage.getItem(
      "visitAdminKey"
    ) || ""
  );
}

function setLoginMessage(
  status = "",
  error = ""
) {
  $("loginStatus").textContent =
    status;

  $("loginError").textContent =
    error;
}

function showLogin() {
  $("dashboard")
    .classList
    .add(
      "hidden"
    );

  $("loginCard")
    .classList
    .remove(
      "hidden"
    );
}

function showDashboard() {
  $("loginCard")
    .classList
    .add(
      "hidden"
    );

  $("dashboard")
    .classList
    .remove(
      "hidden"
    );
}

async function load() {
  const adminKey =
    key();

  if (!adminKey) {
    return;
  }

  const loginButton =
    $("loginBtn");

  loginButton.disabled =
    true;

  const oldButtonText =
    loginButton.textContent;

  loginButton.textContent =
    "正在连接…";

  setLoginMessage(
    `正在连接 ${api} …`,
    ""
  );

  $("dataError").textContent =
    "";

  const ip =
    $("ipFilter")
      .value
      .trim();

  const url =
    new URL(
      api +
      "/admin/visits"
    );

  url.searchParams.set(
    "limit",
    limit
  );

  url.searchParams.set(
    "offset",
    offset
  );

  if (ip) {
    url.searchParams.set(
      "ip",
      ip
    );
  }

  try {
    const response =
      await fetch(
        url,
        {
          method: "GET",

          headers: {
            "X-Admin-Key":
              adminKey
          },

          cache:
            "no-store"
        }
      );

    let data;

    try {
      data =
        await response.json();
    }
    catch {
      const text =
        await response.text();

      throw new Error(
        `服务器返回了非 JSON 内容：${text.slice(0, 180)}`
      );
    }

    if (!response.ok) {
      const message =
        data.detail
          ? `${data.error || "Worker error"}：${data.detail}`
          : (
              data.error ||
              `HTTP ${response.status}`
            );

      if (
        response.status === 401
      ) {
        throw new Error(
          "ADMIN_KEY 不正确。"
        );
      }

      if (
        /no such table:\s*visits/i.test(
          message
        )
      ) {
        throw new Error(
          "D1 已绑定，但 visits 表不存在。v10.2 Worker 会自动创建它；请确认已经部署 v10.2 worker.js。"
        );
      }

      if (
        message.includes(
          "VISITS_DB"
        )
      ) {
        throw new Error(
          "Cloudflare 还没有正确绑定 D1。请确认 ltc-home-bus2 → Bindings 中存在 D1 binding，变量名必须是 VISITS_DB。"
        );
      }

      if (
        message.includes(
          "ADMIN_KEY"
        )
      ) {
        throw new Error(
          "Cloudflare Worker 里还没有 ADMIN_KEY Secret。"
        );
      }

      throw new Error(
        message
      );
    }

    showDashboard();

    $("statTotal").textContent =
      data.stats?.total ?? 0;

    $("statUnique").textContent =
      data.stats?.uniqueIps ?? 0;

    $("stat24").textContent =
      data.stats?.last24Hours ?? 0;

    const visits =
      Array.isArray(
        data.visits
      )
        ? data.visits
        : [];

    $("rows").innerHTML =
      visits
        .map(
          visit => `
            <tr>
              <td>
                ${esc(
                  localTime(
                    visit.visited_at
                  )
                )}
              </td>

              <td class="mono">
                ${esc(
                  visit.ip
                )}
              </td>

              <td>
                ${esc(
                  [
                    visit.city,
                    visit.region,
                    visit.country
                  ]
                    .filter(Boolean)
                    .join(" · ") ||
                  "—"
                )}
              </td>

              <td class="mono">
                ${esc(
                  visit.page ||
                  "—"
                )}
              </td>

              <td>
                ${esc(
                  visit.asn
                    ? `AS${visit.asn}`
                    : "—"
                )}
                <br>
                <span class="muted">
                  ${esc(
                    visit.colo ||
                    ""
                  )}
                </span>
              </td>

              <td>
                <strong>
                  ${esc(
                    device(
                      visit.user_agent
                    )
                  )}
                </strong>
                <br>
                <span class="muted ua">
                  ${esc(
                    visit.user_agent ||
                    ""
                  )}
                </span>
              </td>

              <td>
                ${esc(
                  visit.referrer ||
                  "直接访问"
                )}
              </td>
            </tr>
          `
        )
        .join("") ||
      `
        <tr>
          <td
            colspan="7"
            class="muted"
          >
            暂无记录。先打开一次主页，然后再刷新这里。
          </td>
        </tr>
      `;

    const total =
      Number(
        data.stats?.total ||
        0
      );

    const first =
      total === 0
        ? 0
        : offset + 1;

    const last =
      Math.min(
        offset +
        visits.length,
        total
      );

    $("pageInfo").textContent =
      `${first}–${last} / ${total}`;

    $("prevBtn").disabled =
      offset === 0;

    $("nextBtn").disabled =
      visits.length <
      limit;
  }

  catch (error) {
    console.error(
      "Visit admin:",
      error
    );

    showLogin();

    setLoginMessage(
      "",
      error.message ||
      String(error)
    );

    // 只有明确的密码错误才清掉密码；
    // D1 / 网络错误时保留，方便修好后直接重试。
    if (
      String(
        error.message ||
        ""
      ).includes(
        "ADMIN_KEY 不正确"
      )
    ) {
      sessionStorage
        .removeItem(
          "visitAdminKey"
        );
    }
  }

  finally {
    loginButton.disabled =
      false;

    loginButton.textContent =
      oldButtonText;
  }
}

$("loginBtn").onclick =
  () => {
    const value =
      $("adminKey")
        .value
        .trim();

    if (!value) {
      setLoginMessage(
        "",
        "请输入 ADMIN_KEY。"
      );

      return;
    }

    sessionStorage.setItem(
      "visitAdminKey",
      value
    );

    offset =
      0;

    load();
  };

$("adminKey")
  .addEventListener(
    "keydown",
    event => {
      if (
        event.key ===
        "Enter"
      ) {
        $("loginBtn")
          .click();
      }
    }
  );

$("refreshBtn").onclick =
  load;

$("searchBtn").onclick =
  () => {
    offset =
      0;

    load();
  };

$("ipFilter")
  .addEventListener(
    "keydown",
    event => {
      if (
        event.key ===
        "Enter"
      ) {
        $("searchBtn")
          .click();
      }
    }
  );

$("prevBtn").onclick =
  () => {
    offset =
      Math.max(
        0,
        offset - limit
      );

    load();
  };

$("nextBtn").onclick =
  () => {
    offset +=
      limit;

    load();
  };

$("logoutBtn").onclick =
  () => {
    sessionStorage
      .removeItem(
        "visitAdminKey"
      );

    location.reload();
  };

// 如果这个标签页已经登录过，直接加载。
if (key()) {
  load();
}
</script>
</body>
</html>
