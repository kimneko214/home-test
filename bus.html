<!doctype html>

<html lang="zh-CN">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>公交实时位置</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f4f1;
      --card: #fff;
      --text: #1d1d1f;
      --muted: #777;
      --line: #e5e5df;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    }

    .page {
      max-width: 1100px;
      margin: auto;
      padding:
        calc(16px + env(safe-area-inset-top))
        14px
        calc(35px + env(safe-area-inset-bottom));
    }

    .top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .back,
    .refresh {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      color: #111;
      display: grid;
      place-items: center;
      text-decoration: none;
      font-size: 20px;
      cursor: pointer;
    }

    .title {
      flex: 1;
      min-width: 0;
    }

    .title strong {
      display: block;
      font-size: 19px;
    }

    .title small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary {
      background: white;
      border: 1px solid var(--line);
      border-radius: 21px;
      padding: 17px;
      margin-bottom: 14px;
    }

    .route-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .route {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #1d1d1f;
      color: white;
      font-size: 19px;
      font-weight: 750;
    }

    .info {
      flex: 1;
      min-width: 0;
      padding-top: 2px;
    }

    .info strong {
      display: block;
      font-size: 17px;
      line-height: 1.35;
    }

    .info small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .eta {
      flex: 0 0 auto;
      min-width: 100px;
      text-align: right;
    }

    .eta-main {
      display: block;
      font-size: 28px;
      font-weight: 750;
      line-height: 1;
    }

    .eta-times {
      margin-top: 7px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .eta-time-row {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      font-size: 10px;
      white-space: nowrap;
    }

    .eta-time-row.live {
      color: #347a49;
    }

    .eta-time-row.schedule {
      color: #888;
    }

    .delay-badge {
      display: inline-flex;
      justify-content: center;
      margin-top: 6px;
      padding: 4px 7px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 700;
    }

    .delay-badge.ontime {
      background: #eaf2eb;
      color: #44724e;
    }

    .delay-badge.late {
      background: #f4eee3;
      color: #896522;
    }

    .delay-badge.late-strong {
      background: #f5e7e5;
      color: #a34b42;
    }

    .delay-badge.early {
      background: #e8eef7;
      color: #49688d;
    }

    .map-wrap {
      position: relative;
    }

    #map {
      width: 100%;
      height: 60vh;
      min-height: 430px;
      border-radius: 23px;
      border: 1px solid var(--line);
      overflow: hidden;
      background: #e9e9e5;
    }

    .legend {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 500;
      padding: 10px 12px;
      border-radius: 13px;
      border: 1px solid rgba(0,0,0,.08);
      background: rgba(255,255,255,.93);
      backdrop-filter: blur(8px);
      font-size: 11px;
      line-height: 1.5;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-row + .legend-row {
      margin-top: 5px;
    }

    .legend-line {
      width: 24px;
      height: 4px;
      border-radius: 999px;
    }

    .legend-line.full {
      background: #676767;
    }

    .legend-line.trip {
      background: #2875e8;
    }

    .vehicle-marker {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: white;
      border: 2px solid #1d1d1f;
      box-shadow: 0 4px 13px rgba(0,0,0,.25);
      font-size: 24px;
    }

    .stop-marker {
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #1d1d1f;
      color: white;
      border: 3px solid white;
      box-shadow: 0 4px 12px rgba(0,0,0,.22);
      font-size: 17px;
    }

    .status {
      margin-top: 14px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 19px;
      padding: 15px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .status > strong {
      color: var(--text);
    }

    .status-grid {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );
      gap: 10px;
      margin-top: 10px;
    }

    .status-item {
      padding: 11px;
      border-radius: 13px;
      background: #f5f5f2;
    }

    .status-item small {
      display: block;
      color: #999;
      margin-bottom: 3px;
    }

    .status-item strong {
      display: block;
      color: var(--text);
      font-size: 13px;
    }

    .schedule-note {
      margin-top: 10px;
      padding: 9px 11px;
      border-radius: 12px;
      background: #f4f2ed;
      color: #8c7650;
      font-size: 10px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      #map {
        height: 54vh;
        min-height: 370px;
      }

      .summary {
        padding: 14px;
      }

      .eta {
        min-width: 88px;
      }

      .eta-main {
        font-size: 23px;
      }

      .info strong {
        font-size: 15px;
      }

      .status-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

  </style>

</head>

<body>

<main class="page">

  <div class="top">

    <a
      class="back"
      href="./"
      aria-label="返回主页"
    >
      ‹
    </a>

    <div class="title">

      <strong>
        公交实时位置
      </strong>

      <small id="pageTitle">
        正在读取…
      </small>

    </div>

    <button
      id="refresh"
      class="refresh"
      type="button"
      aria-label="刷新"
    >
      ↻
    </button>

  </div>


  <section class="summary">

    <div class="route-row">

      <div
        id="routeBadge"
        class="route"
      >
        --
      </div>

      <div class="info">

        <strong id="headsign">
          正在读取班次…
        </strong>

        <small id="stopName">
          —
        </small>

      </div>

      <div class="eta">

        <strong
          id="eta"
          class="eta-main"
        >
          --
        </strong>

        <div class="eta-times">

          <div
            id="realtimeRow"
            class="eta-time-row live"
          >
            <span>● 实时</span>
            <b id="predictedTime">--:--</b>
          </div>

          <div
            id="scheduleRow"
            class="eta-time-row schedule"
          >
            <span>○ 表定</span>
            <b id="scheduledTime">--:--</b>
          </div>

        </div>

        <span
          id="delayBadge"
          class="delay-badge ontime"
        >
          比较中
        </span>

      </div>

    </div>

  </section>


  <div class="map-wrap">

    <div id="map"></div>

    <div class="legend">

      <div class="legend-row">
        <span class="legend-line full"></span>
        <span>整条线路</span>
      </div>

      <div class="legend-row">
        <span class="legend-line trip"></span>
        <span>当前方向</span>
      </div>

      <div class="legend-row">
        <span>🚌</span>
        <span>当前车辆</span>
      </div>

      <div class="legend-row">
        <span>🚏</span>
        <span>你的上车站</span>
      </div>

    </div>

  </div>


  <div
    id="status"
    class="status"
  >
    正在读取实时公交位置……
  </div>

</main>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script src="config.js"></script>


<script>

  const params =
    new URLSearchParams(
      location.search
    );

  const tripId =
    params.get("tripId") || "";

  const route =
    params.get("route") || "";

  const stopId =
    params.get("stopId") || "";

  const initialMinutes =
    params.get("minutes") || "";

  const initialHeadsign =
    params.get("headsign") || "";

  const initialRealtime =
    params.get("realtime") === "1";


  document
    .getElementById("routeBadge")
    .textContent =
      route || "?";

  document
    .getElementById("headsign")
    .textContent =
      initialHeadsign ||
      `Route ${route}`;

  document
    .getElementById("pageTitle")
    .textContent =
      initialHeadsign ||
      `Route ${route}`;

  document
    .getElementById("eta")
    .textContent =
      initialMinutes
        ? `${initialMinutes} min`
        : "--";

  document
    .getElementById("stopName")
    .textContent =
      stopId
        ? `Stop #${stopId}`
        : "—";

  if (!initialRealtime) {
    document
      .getElementById("realtimeRow")
      .style.display =
        "none";
  }


  // ========================================================
  // Map
  // ========================================================

  const map =
    L.map(
      "map",
      {
        zoomControl: true
      }
    )
    .setView(
      [
        42.9849,
        -81.2453
      ],
      12
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        "© OpenStreetMap"
    }
  )
  .addTo(map);

  const fullRouteLayer =
    L.layerGroup()
      .addTo(map);

  const tripRouteLayer =
    L.layerGroup()
      .addTo(map);

  const busIcon =
    L.divIcon(
      {
        className: "",
        html:
          '<div class="vehicle-marker">🚌</div>',
        iconSize:
          [44, 44],
        iconAnchor:
          [22, 22]
      }
    );

  const stopIcon =
    L.divIcon(
      {
        className: "",
        html:
          '<div class="stop-marker">🚏</div>',
        iconSize:
          [37, 37],
        iconAnchor:
          [18, 18]
      }
    );

  let vehicleMarker =
    null;

  let stopMarker =
    null;

  let firstFit =
    true;

  let routeLoaded =
    false;


  // ========================================================
  // Helpers
  // ========================================================

  function escapeHtml(
    value = ""
  ) {
    return String(value)
      .replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[character])
      );
  }

  function geometryToLines(
    geometry
  ) {
    if (!geometry) {
      return [];
    }

    if (
      geometry.type ===
        "LineString" &&
      Array.isArray(
        geometry.coordinates
      )
    ) {
      return [
        geometry
          .coordinates
          .map(
            coordinate => [
              Number(
                coordinate[1]
              ),
              Number(
                coordinate[0]
              )
            ]
          )
          .filter(
            point =>
              Number.isFinite(
                point[0]
              ) &&
              Number.isFinite(
                point[1]
              )
          )
      ];
    }

    if (
      geometry.type ===
        "MultiLineString" &&
      Array.isArray(
        geometry.coordinates
      )
    ) {
      return geometry
        .coordinates
        .map(
          line =>
            line
              .map(
                coordinate => [
                  Number(
                    coordinate[1]
                  ),
                  Number(
                    coordinate[0]
                  )
                ]
              )
              .filter(
                point =>
                  Number.isFinite(
                    point[0]
                  ) &&
                  Number.isFinite(
                    point[1]
                  )
              )
        )
        .filter(
          line =>
            line.length >= 2
        );
    }

    return [];
  }

  function drawGeometry(
    layer,
    geometry,
    options
  ) {
    layer.clearLayers();

    const lines =
      geometryToLines(
        geometry
      );

    const points =
      [];

    for (const latlngs of lines) {
      if (
        latlngs.length < 2
      ) {
        continue;
      }

      L.polyline(
        latlngs,
        options
      )
      .addTo(layer);

      points.push(
        ...latlngs
      );
    }

    return points;
  }

  function cleanStopName(
    name,
    code
  ) {
    let result =
      String(
        name || ""
      );

    result = result.replace(
      new RegExp(
        `\\s*-?\\s*#${String(code)}\\s*$`,
        "i"
      ),
      ""
    );

    return result.trim();
  }

  function getDelayDisplay(
    delayMinutes
  ) {
    if (
      delayMinutes === null ||
      delayMinutes === undefined ||
      !Number.isFinite(
        Number(delayMinutes)
      )
    ) {
      return {
        text: "无实时偏差",
        className:
          "ontime"
      };
    }

    const delay =
      Number(
        delayMinutes
      );

    if (
      Math.abs(delay) <= 1
    ) {
      return {
        text: "基本准点",
        className:
          "ontime"
      };
    }

    if (
      delay > 0
    ) {
      return {
        text:
          `晚点 +${delay} min`,
        className:
          delay >= 5
            ? "late-strong"
            : "late"
      };
    }

    return {
      text:
        `提前 ${Math.abs(delay)} min`,
      className:
        "early"
    };
  }

  function getVehicleAgeText(
    timestamp
  ) {
    const unix =
      Number(timestamp);

    if (
      !Number.isFinite(unix)
    ) {
      return "—";
    }

    const ageSeconds =
      Math.max(
        0,
        Math.round(
          Date.now() / 1000 -
          unix
        )
      );

    if (
      ageSeconds < 60
    ) {
      return `${ageSeconds} 秒前`;
    }

    const minutes =
      Math.round(
        ageSeconds / 60
      );

    return `${minutes} 分钟前`;
  }


  // ========================================================
  // Schedule comparison UI
  // ========================================================

  function updateTimingUi(
    data
  ) {
    const realtimeRow =
      document.getElementById(
        "realtimeRow"
      );

    const scheduleRow =
      document.getElementById(
        "scheduleRow"
      );

    const predictedTime =
      document.getElementById(
        "predictedTime"
      );

    const scheduledTime =
      document.getElementById(
        "scheduledTime"
      );

    const delayBadge =
      document.getElementById(
        "delayBadge"
      );

    if (
      data.realtime &&
      data.predictedTime
    ) {
      realtimeRow.style.display =
        "flex";

      predictedTime.textContent =
        data.predictedTime;
    }

    else {
      realtimeRow.style.display =
        "none";
    }

    if (
      data.scheduledTime
    ) {
      scheduleRow.style.display =
        "flex";

      scheduledTime.textContent =
        data.scheduledTime;
    }

    else {
      scheduleRow.style.display =
        "none";
    }

    const delay =
      getDelayDisplay(
        data.delayMinutes
      );

    delayBadge.textContent =
      delay.text;

    delayBadge.className =
      `delay-badge ${delay.className}`;

    if (
      !data.realtime
    ) {
      delayBadge.style.display =
        "none";
    }

    else {
      delayBadge.style.display =
        "inline-flex";
    }
  }


  // ========================================================
  // Full route geometry
  // ========================================================

  async function loadFullRoute() {
    if (
      routeLoaded ||
      !route
    ) {
      return [];
    }

    const api =
      CONFIG
        .TRANSIT_API_URL
        .replace(
          /\/+$/,
          ""
        );

    const response =
      await fetch(
        `${api}/route-vehicles?route=${encodeURIComponent(route)}`,
        {
          cache:
            "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        `Route API HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    if (data.error) {
      throw new Error(
        data.detail ||
        data.error
      );
    }

    routeLoaded =
      true;

    return drawGeometry(
      fullRouteLayer,
      data.route?.geometry ||
      null,
      {
        color:
          "#5c5c5c",
        weight:
          8,
        opacity:
          0.30,
        lineCap:
          "round",
        lineJoin:
          "round"
      }
    );
  }


  // ========================================================
  // Vehicle
  // ========================================================

  async function loadVehicle() {
    const refreshButton =
      document.getElementById(
        "refresh"
      );

    refreshButton.disabled =
      true;

    try {
      if (!tripId) {
        throw new Error(
          "这个班次没有 tripId，无法查询车辆。"
        );
      }

      const api =
        CONFIG
          .TRANSIT_API_URL
          .replace(
            /\/+$/,
            ""
          );

      const query =
        new URLSearchParams({
          tripId,
          route,
          stopId
        });

      const promises = [
        fetch(
          `${api}/vehicle?${query.toString()}`,
          {
            cache:
              "no-store"
          }
        )
      ];

      if (!routeLoaded) {
        promises.push(
          loadFullRoute()
        );
      }

      const results =
        await Promise.all(
          promises
        );

      const vehicleResponse =
        results[0];

      if (
        !vehicleResponse.ok
      ) {
        throw new Error(
          `Vehicle API HTTP ${vehicleResponse.status}: ${await vehicleResponse.text()}`
        );
      }

      const data =
        await vehicleResponse.json();

      if (data.error) {
        throw new Error(
          data.detail ||
          data.error
        );
      }

      const headsign =
        data.headsign ||
        initialHeadsign ||
        `Route ${route}`;

      document
        .getElementById(
          "headsign"
        )
        .textContent =
          headsign;

      document
        .getElementById(
          "pageTitle"
        )
        .textContent =
          headsign;

      if (
        data.minutes !== null &&
        data.minutes !== undefined
      ) {
        document
          .getElementById(
            "eta"
          )
          .textContent =
            `${data.minutes} min`;
      }

      updateTimingUi(
        data
      );

      const tripPoints =
        drawGeometry(
          tripRouteLayer,
          data.shape,
          {
            color:
              "#2875e8",
            weight:
              5,
            opacity:
              0.88,
            lineCap:
              "round",
            lineJoin:
              "round"
          }
        );

      let stopPoint =
        null;

      if (
        data.stop &&
        Number.isFinite(
          Number(
            data.stop.lat
          )
        ) &&
        Number.isFinite(
          Number(
            data.stop.lon
          )
        )
      ) {
        stopPoint = [
          Number(
            data.stop.lat
          ),
          Number(
            data.stop.lon
          )
        ];

        if (stopMarker) {
          stopMarker.setLatLng(
            stopPoint
          );
        }

        else {
          stopMarker =
            L.marker(
              stopPoint,
              {
                icon:
                  stopIcon
              }
            )
            .addTo(map);
        }

        const name =
          cleanStopName(
            data.stop.name,
            data.stop.code
          );

        stopMarker.bindPopup(
          `${escapeHtml(name)}<br>` +
          `Stop #${escapeHtml(data.stop.code)}`
        );

        document
          .getElementById(
            "stopName"
          )
          .textContent =
            `${name} · #${data.stop.code}`;
      }

      let vehiclePoint =
        null;

      if (
        data.vehicle &&
        Number.isFinite(
          Number(
            data.vehicle.lat
          )
        ) &&
        Number.isFinite(
          Number(
            data.vehicle.lon
          )
        )
      ) {
        vehiclePoint = [
          Number(
            data.vehicle.lat
          ),
          Number(
            data.vehicle.lon
          )
        ];

        if (vehicleMarker) {
          vehicleMarker
            .setLatLng(
              vehiclePoint
            );
        }

        else {
          vehicleMarker =
            L.marker(
              vehiclePoint,
              {
                icon:
                  busIcon
              }
            )
            .addTo(map);
        }

        vehicleMarker.bindPopup(
          `<strong>Route ${escapeHtml(route)}</strong><br>` +
          `${escapeHtml(headsign)}<br>` +
          `车辆：${escapeHtml(
            data.vehicle.label ||
            data.vehicle.id ||
            "LTC Bus"
          )}`
        );

        const vehicleAge =
          getVehicleAgeText(
            data.vehicle.timestamp
          );

        const delay =
          getDelayDisplay(
            data.delayMinutes
          );

        const scheduleNote =
          data.scheduleInterpolated
            ? `
                <div class="schedule-note">
                  这个站的静态 GTFS 表定时间是 Transitland 根据前后 timepoint 插值得到的，因此“表定”本身也可能是近似值。
                </div>
              `
            : "";

        document
          .getElementById(
            "status"
          )
          .innerHTML = `

            <strong>
              🟢 已找到这辆公交
            </strong>

            <div class="status-grid">

              <div class="status-item">
                <small>车辆</small>
                <strong>
                  ${escapeHtml(
                    data.vehicle.label ||
                    data.vehicle.id ||
                    "LTC Bus"
                  )}
                </strong>
              </div>

              <div class="status-item">
                <small>车辆位置数据</small>
                <strong>
                  ${escapeHtml(
                    vehicleAge
                  )}
                </strong>
              </div>

              <div class="status-item">
                <small>实时预计到站</small>
                <strong>
                  ${
                    data.predictedTime
                      ? escapeHtml(
                          data.predictedTime
                        )
                      : "—"
                  }
                </strong>
              </div>

              <div class="status-item">
                <small>时刻表到站</small>
                <strong>
                  ${
                    data.scheduledTime
                      ? escapeHtml(
                          data.scheduledTime
                        )
                      : "—"
                  }
                </strong>
              </div>

              <div class="status-item">
                <small>实时与表定偏差</small>
                <strong>
                  ${escapeHtml(
                    delay.text
                  )}
                </strong>
              </div>

              <div class="status-item">
                <small>位置更新时间</small>
                <strong>
                  ${escapeHtml(
                    data.vehicle.updatedText ||
                    "—"
                  )}
                </strong>
              </div>

            </div>

            ${scheduleNote}

          `;
      }

      else {
        if (vehicleMarker) {
          map.removeLayer(
            vehicleMarker
          );

          vehicleMarker =
            null;
        }

        const delay =
          getDelayDisplay(
            data.delayMinutes
          );

        document
          .getElementById(
            "status"
          )
          .innerHTML = `

            <strong>
              暂时没有这一班车的车辆定位
            </strong>

            <br>

            实时预计：
            ${escapeHtml(
              data.predictedTime ||
              "—"
            )}
            ·
            表定：
            ${escapeHtml(
              data.scheduledTime ||
              "—"
            )}
            ·
            ${escapeHtml(
              delay.text
            )}

          `;
      }

      if (firstFit) {
        let fitPoints =
          tripPoints;

        if (
          !fitPoints.length
        ) {
          const bounds =
            fullRouteLayer
              .getBounds?.();

          if (
            bounds &&
            bounds.isValid()
          ) {
            map.fitBounds(
              bounds,
              {
                padding:
                  [35, 35],
                maxZoom:
                  14
              }
            );

            firstFit =
              false;

            return;
          }
        }

        if (
          fitPoints.length
        ) {
          map.fitBounds(
            L.latLngBounds(
              fitPoints
            ),
            {
              padding:
                [35, 35],
              maxZoom:
                14
            }
          );

          firstFit =
            false;
        }

        else if (
          vehiclePoint ||
          stopPoint
        ) {
          map.setView(
            vehiclePoint ||
            stopPoint,
            15
          );

          firstFit =
            false;
        }
      }
    }

    catch (error) {
      console.error(error);

      document
        .getElementById(
          "status"
        )
        .innerHTML =
          `<strong>读取失败</strong><br>` +
          `${escapeHtml(
            error.message ||
            String(error)
          )}`;
    }

    finally {
      refreshButton.disabled =
        false;
    }
  }

  document
    .getElementById(
      "refresh"
    )
    .addEventListener(
      "click",
      loadVehicle
    );

  loadVehicle();

  setInterval(
    loadVehicle,
    30000
  );

</script>

</body>

</html>
